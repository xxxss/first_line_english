<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>First Line English</title>
<meta name="theme-color" content="#3b6ef5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="First Line">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1c2126; --muted:#6b7683;
    --line:#e6e9ee; --brand:#3b6ef5; --brand-ink:#fff;
    --good:#1a9c6b; --ok:#c98a1a; --bad:#d1495b;
    --shadow:0 1px 3px rgba(20,30,50,.08),0 8px 24px rgba(20,30,50,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1216; --card:#171b21; --ink:#e8ecf1; --muted:#93a0ad;
      --line:#252c35; --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 0}
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 60px}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
  .streak{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:6px 11px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
  .btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;
    font-size:16px;font-weight:650;cursor:pointer;font-family:inherit;transition:transform .06s,filter .15s}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:var(--brand);color:var(--brand-ink)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:9px}
  .row>*{flex:1}
  .pill{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);
    background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .ctx{color:var(--muted);font-size:14px;margin:2px 0 16px}
  .said{font-size:15px;color:var(--muted);margin-bottom:4px}
  .line-en{font-size:21px;font-weight:600;line-height:1.35}
  .target{font-size:22px;font-weight:700;line-height:1.35;color:var(--brand)}
  .mic{width:96px;height:96px;border-radius:50%;border:0;margin:6px auto;display:flex;
    align-items:center;justify-content:center;font-size:38px;cursor:pointer;
    background:var(--brand);color:#fff;box-shadow:0 6px 20px rgba(59,110,245,.35)}
  .mic.live{animation:pulse 1.1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,110,245,.45)}70%{box-shadow:0 0 0 22px rgba(59,110,245,0)}100%{box-shadow:0 0 0 0 rgba(59,110,245,0)}}
  .center{text-align:center}
  .lat{font-size:44px;font-weight:800;letter-spacing:-1px;margin:6px 0 0}
  .lat small{font-size:18px;font-weight:600;color:var(--muted)}
  .lat.good{color:var(--good)} .lat.ok{color:var(--ok)} .lat.bad{color:var(--bad)}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .score .btn{padding:13px 8px;font-size:14px}
  .s-bad{background:rgba(209,73,91,.12);color:var(--bad)}
  .s-ok{background:rgba(201,138,26,.14);color:var(--ok)}
  .s-good{background:rgba(26,156,107,.14);color:var(--good)}
  .drill-dots{display:flex;gap:8px;justify-content:center;margin:14px 0}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--line);transition:background .2s}
  .dot.on{background:var(--good)}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto}
  .tab{flex:1;text-align:center;padding:11px 0 calc(11px + env(safe-area-inset-bottom));
    font-size:12px;color:var(--muted);cursor:pointer;font-weight:600}
  .tab.active{color:var(--brand)}
  .tab b{display:block;font-size:19px;font-weight:400;line-height:1.1}
  .list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:0}
  .box-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
  .num{width:26px;height:26px;border-radius:8px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
  .bars{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:8px}
  .bars .b{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
  .banner{background:rgba(201,138,26,.12);color:var(--ok);border:1px solid rgba(201,138,26,.3);
    border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:14px}
  .big{font-size:15px;font-weight:600;margin:0 0 3px}
  .muted{color:var(--muted)}
  .scene{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
  .scene-ico{font-size:38px;line-height:1;flex-shrink:0}
  .scene-txt{font-size:16px;line-height:1.55}
  .goal{background:rgba(59,110,245,.1);color:var(--brand);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;margin:0 0 6px}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet-card{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:520px;box-shadow:var(--shadow)}
  @media(min-width:521px){.sheet{align-items:center}.sheet-card{border-radius:18px}}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div><h1>First Line English</h1><div class="sub" id="dateSub"></div></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="streak" id="voiceBtn" onclick="toggleSheet(true)" style="cursor:pointer">🔊</button>
      <div class="streak" id="streak">🔥 0</div>
    </div>
  </div>
  <div id="view"></div>
</div>
<div id="sheet" class="sheet hidden" onclick="if(event.target===this)toggleSheet(false)">
  <div class="sheet-card">
    <div class="big">🔊 Voice</div>
    <div class="ctx">Switch anytime — even mid-practice. Pick the one that sounds best.</div>
    <select id="voiceSel2" onchange="setVoice(this.value);testVoice()"
      style="width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit"></select>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-ghost" onclick="testVoice()">🔊 Test</button>
      <button class="btn btn-primary" onclick="toggleSheet(false)">Done</button>
    </div>
  </div>
</div>

<div class="tabbar">
  <div class="tab active" data-tab="home"><b>▲</b>Today</div>
  <div class="tab" data-tab="progress"><b>◔</b>Progress</div>
</div>

<script>
"use strict";
//////////////////// scenario data (loaded from scenarios.json) ////////////////////
let SCENARIOS = [];
const NEW_CAP = 6;                       // max brand-new scenarios per day (new items are the heaviest)
const DEFAULT_GOAL = 12;                 // default daily total (reviews + new); user-adjustable
const BOX_DAYS = {1:1, 2:2, 3:4, 4:7};  // Leitner intervals (days)
const DAY = 86400000;

//////////////////// state ////////////////////
const LS = 'fle_state_v3';
const ONBOARD_KEY = 'fle_onboarded_v1';
const DAY_START_HOUR = 4;   // 逻辑日从凌晨4点开始：4点前的练习算「前一天」，避免跨午夜被误判漏练
function today(){ const d=new Date(); d.setHours(d.getHours()-DAY_START_HOUR); d.setHours(0,0,0,0); return d.getTime(); }
function load(){
  let s; try{ s = JSON.parse(localStorage.getItem(LS)); }catch(e){}
  if(!s) s = {sc:{}, introduced:[], lastActive:0, streak:0};
  return s;
}
function save(){ localStorage.setItem(LS, JSON.stringify(state)); }
let state = load();
if(state.streakDay===undefined) state.streakDay = 0;      // 上次"完成打卡"的那天
if(state.freezes===undefined)  state.freezes = 2;         // 连胜保护数（漏一天自动补）
if(!Array.isArray(state.doneDays)) state.doneDays = [];   // 完成过的日期（画打卡条用）

function scState(id){
  if(!state.sc[id]) state.sc[id] = {box:1, due:today(), hist:[]};
  return state.sc[id];
}
function dailyGoal(){ return state.dailyGoal || DEFAULT_GOAL; }
function setGoal(n){ state.dailyGoal = n; save(); renderHome(); }
// 今日计划（不改状态）：复习优先、封顶到 goal；剩余名额再补新题；复习已满则今天不加新题
function computePlan(){
  const t = today();
  const done = (state.doneDay===t) ? (state.doneCount||0) : 0;
  const budget = Math.max(0, dailyGoal() - done);   // 今日目标扣掉已完成的，剩下的才是今天还要做的
  const newToday = (state.newDay===t) ? (state.newCount||0) : 0;
  // 按"相对自身间隔的濒临遗忘程度"排：最快要忘的今天先练；被顺延的自然是最成熟、最耐放的成熟题（延后损失最小）
  const risk = id => { const st=scState(id); return (t - st.due) / (BOX_DAYS[st.box]||1); };
  const reviews = state.introduced.filter(id=>scState(id).due<=t)
    .sort((a,b)=> (risk(b) - risk(a)) || (scState(a).box - scState(b).box))
    .slice(0, budget);
  const roomForNew = Math.max(0, Math.min(budget - reviews.length, NEW_CAP - newToday, SCENARIOS.length - state.introduced.length));
  const news = SCENARIOS.map(s=>s.id).filter(id=>!state.introduced.includes(id)).slice(0, roomForNew);
  return {reviews, news};
}
// 连胜：以"完成当日目标"计一天；漏一天用 freeze 自动补，补不上才清零
let frozeMsg = 0;
function markStreakDone(){
  const t = today();
  if(state.streakDay === t) return;                        // 今天已计过
  if(!state.doneDays.includes(t)) state.doneDays.push(t);
  if(state.doneDays.length > 60) state.doneDays = state.doneDays.slice(-60);
  const prev = state.streakDay || 0;
  if(!prev){ state.streak = 1; }
  else {
    const gap = Math.round((t - prev) / DAY);
    if(gap === 1){ state.streak = (state.streak||0) + 1; }  // 连着来
    else {
      const missed = gap - 1;                               // 中间漏了几天
      if((state.freezes||0) >= missed){ state.freezes -= missed; frozeMsg = missed; state.streak = (state.streak||0) + 1; }
      else { state.streak = 1; }                            // freeze 不够，清零重来
    }
  }
  if(state.streak > 0 && state.streak % 5 === 0 && (state.freezes||0) < 3) state.freezes = (state.freezes||0) + 1; // 每 5 天送 1 个 freeze（上限 3）
  state.streakDay = t;
  save();
}

//////////////////// speech: TTS + mic latency detection ////////////////////
let enVoice = null, enVoices = [], zhVoice = null;
const VOICE_KEY = 'fle_voice';
function rankVoice(v){
  const n = (v.name||'')+' '+(v.voiceURI||''); let s=0;
  if(/enhanced|premium|neural|siri/i.test(n)) s+=100;
  if(/en-AU/i.test(v.lang)) s+=8; else if(/en-GB/i.test(v.lang)) s+=6; else if(/en-US/i.test(v.lang)) s+=4;
  if(/compact|eloquence|novelty|fred|albert|zarvox|trinoids|whisper|bells|bad|cellos|organ|bahh|boing|jester|superstar/i.test(n)) s-=200;
  return s;
}
function voiceOptions(){
  return enVoices.map(v=>`<option value="${v.voiceURI}" ${v===enVoice?'selected':''}>${v.name} · ${v.lang}${/enhanced|premium|siri/i.test(v.name)?' ⭐':''}</option>`).join('');
}
function refreshVoices(){
  if(!('speechSynthesis' in window)) return;
  enVoices = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>rankVoice(b)-rankVoice(a));
  const saved = localStorage.getItem(VOICE_KEY);
  enVoice = enVoices.find(v=>v.voiceURI===saved) || enVoices[0] || null;
  zhVoice = speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang)) || null;
  const sel = document.getElementById('voiceSel'); if(sel) sel.innerHTML = voiceOptions();
  const s2 = document.getElementById('voiceSel2'); if(s2) s2.innerHTML = voiceOptions();
}
function setVoice(uri){ localStorage.setItem(VOICE_KEY, uri); enVoice = enVoices.find(v=>v.voiceURI===uri) || enVoice; }
function testVoice(){ speak("Hi there! What can I get you today?"); }
function toggleSheet(show){
  const sh = document.getElementById('sheet'); if(!sh) return;
  if(show){ const s2=document.getElementById('voiceSel2'); if(s2) s2.innerHTML=voiceOptions(); sh.classList.remove('hidden'); }
  else sh.classList.add('hidden');
}
const CAT_ICON = {'Food & Coffee':'☕','Shopping':'🛍️','Problems & Returns':'🔧','Getting Around':'🧭','Phone & Booking':'📞','Small Talk':'💬','Work & Meetings':'💼','Clarify & Repair':'👂','Travel & Hotel':'🧳','Health & Doctor':'🩺','Money & Bank':'🏦','Home & Services':'🏠','Help & Favours':'🤝','Feelings & Reactions':'💛','Making Plans':'📅'};
function catIcon(c){ return CAT_ICON[c] || '🗣️'; }
// scene narration: English (immersion-first) via English voice
function narrateScene(id){ const s=SCENARIOS.find(x=>x.id===id); if(s) speak((s.setup||s.ctx)+(s.goal?'. '+s.goal:''), 0.98, enVoice); }
// native-language fallback: reveal + read the Chinese version only if asked
function showNative(id){
  const s=SCENARIOS.find(x=>x.id===id); if(!s) return;
  const el=document.getElementById('sceneNative');
  if(el){ el.textContent = s.ctx || ''; el.classList.remove('hidden'); }
  if(zhVoice && s.ctx) speak(s.ctx, 1.0, zhVoice);
}
function peek(id){ const s=SCENARIOS.find(x=>x.id===id); const el=document.getElementById('peek'); if(el&&s) el.textContent = s.target; }
if('speechSynthesis' in window){ refreshVoices(); speechSynthesis.onvoiceschanged = refreshVoices; }
function speak(text, rate=0.97, voice){
  return new Promise(res=>{
    if(!('speechSynthesis' in window) || !text){ setTimeout(res,150); return; }
    speechSynthesis.cancel();
    const v = voice || enVoice;
    const u = new SpeechSynthesisUtterance(text);
    if(v) u.voice = v; u.lang = v?v.lang:'en-US'; u.rate = rate; u.pitch = 1;
    let done=false; const finish=()=>{ if(done) return; done=true; res(); };
    u.onend = finish; u.onerror = finish;
    // 安全兜底：部分浏览器对某些句子不触发 onend，会卡在读完这步 → 按字数估算最长时长后强制继续
    setTimeout(finish, Math.min(12000, 1200 + text.length*90));
    speechSynthesis.speak(u);
  });
}
function voiceCardHTML(){
  return `<div class="card">
    <div class="big">🔊 Voice</div>
    <div class="ctx">Pick the voice that sounds best. You can also change it anytime from the 🔊 button up top.</div>
    <select id="voiceSel" onchange="setVoice(this.value);testVoice()"
      style="width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit">
      ${voiceOptions()}
    </select>
    <button class="btn btn-ghost" style="margin-top:10px" onclick="testVoice()">🔊 Test</button>
  </div>`;
}

let micStream=null, audioCtx=null, rafId=null, micOK=null, micDirty=false;
// 健康 = 流未被标脏、轨道 live 且未被静音、音频上下文在运行
function micLive(){ return micStream && !micDirty && audioCtx && audioCtx.state==='running'
  && micStream.getAudioTracks().some(t=>t.readyState==='live' && !t.muted); }
async function ensureMic(){
  if(micLive()) return true;
  try{
    // 锁屏/切后台常把轨道静音而不改 readyState —— 一律彻底重建流 + 上下文，别信旧状态
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    if(micDirty && audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx=null; }
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    if(!audioCtx || audioCtx.state==='closed'){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(audioCtx.state==='suspended'){ try{ await audioCtx.resume(); }catch(e){} }
    micDirty=false; micOK=true; return true;
  }catch(e){ micOK=false; return false; }
}
// 切后台/锁屏：标记麦克风为脏 + 中止正在进行的录音，回来时强制重建
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ micDirty=true; stopListen(); }
  else if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume().catch(()=>{}); }
});
// listen: from t0, report latency(ms) on speech onset; call onEnd when speech stops
function listen(onOnset, onEnd){
  const src = audioCtx.createMediaStreamSource(micStream);
  const an = audioCtx.createAnalyser(); an.fftSize = 512;
  src.connect(an);
  const buf = new Uint8Array(an.fftSize);
  const rms = ()=>{ an.getByteTimeDomainData(buf); let s=0;
    for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128; s+=v*v;} return Math.sqrt(s/buf.length); };
  let amb=0, n=0; const calStart=performance.now();
  let onset=false, lastLoud=0, thr=0.04, t0=0;
  function calibrate(){
    amb=Math.max(amb, rms()); n++;
    if(performance.now()-calStart < 400){ rafId=requestAnimationFrame(calibrate); }
    else { thr = Math.min(0.2, Math.max(0.045, amb*2.2)); t0=performance.now(); lastLoud=t0; rafId=requestAnimationFrame(loop); }
  }
  function loop(){
    const now=performance.now(), v=rms();
    if(!onset){
      if(v>thr){ onset=true; lastLoud=now; onOnset(Math.round(now-t0)); }
      else if(now-t0>12000){ cancelAnimationFrame(rafId); onEnd(true); return; }
    }else{
      if(v>thr) lastLoud=now;
      if(now-lastLoud>750){ cancelAnimationFrame(rafId); onEnd(false); return; }
    }
    rafId=requestAnimationFrame(loop);
  }
  rafId=requestAnimationFrame(calibrate);
}
function stopListen(){ if(rafId) cancelAnimationFrame(rafId); rafId=null; }

//////////////////// practice flow ////////////////////
let queue=[], queue2=[], pass=1, qi=0, curLat=null, focusCat=null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
// 会话进度持久化：中途关掉再回来能从断点续上，两轮不会丢
function saveSession(){ state.session = {queue, queue2, pass, qi, day: today(), focus: focusCat}; save(); }
function clearSession(){ state.session = null; save(); }
function hasSession(){ return !!(state.session && state.session.day===today()); }
function resumeSession(){ const s=state.session; queue=s.queue; queue2=s.queue2; pass=s.pass; qi=s.qi; focusCat=s.focus||null; runStep(); }

function startSession(){
  focusCat=null;
  const t=today();
  if(state.newDay!==t){ state.newDay=t; state.newCount=0; }
  const {reviews, news} = computePlan();
  news.forEach(id=>{ state.introduced.push(id); scState(id); });   // 真正引入今天的新题
  state.newCount = (state.newCount||0) + news.length;
  queue = [...reviews, ...news];
  queue2 = shuffle([...queue]);   // 第2轮(极速轮)打乱顺序，让每句的提取远离它的跟读
  pass = 1; qi = 0;
  if(queue.length===0){ save(); renderHome(); return; }
  saveSession();
  runStep();
}
// 主题集中练习：为近期真实目标（如面试）针对性密集练一个类目，不受每日封顶限制；SRS 照常记
function startFocus(cat){
  focusCat = cat;
  const ids = SCENARIOS.filter(s=>(s.cat||'Other')===cat).map(s=>s.id);
  ids.forEach(id=>{ if(!state.introduced.includes(id)){ state.introduced.push(id); scState(id); } });
  queue = [...ids];
  queue2 = shuffle([...queue]);
  pass = 1; qi = 0;
  if(queue.length===0){ save(); renderHome(); return; }
  saveSession();
  runStep();
}
// 一次 session 分两轮交错：
//  第1轮 — 每个场景：准备 → 冷启动 → 影子跟读×3 → 打分（装进去 + 驱动 SRS）
//  第2轮 — 打乱后：  每个场景：4/3/2 极速轮（间隔提取，此时已被其他场景隔开）
//  进度(queue/pass/qi)持久化，中途退出可续
function runStep(){
  if(pass===1){
    if(qi>=queue.length){ pass=2; qi=0; runStep(); return; }
    saveSession(); curLat=null;
    renderScenarioIntro(SCENARIOS.find(x=>x.id===queue[qi]));
  }else{
    if(qi>=queue2.length){ renderDone(); return; }
    saveSession();
    speedIntro(queue2[qi]);
  }
}
async function playAndListen(s){
  const micReady = await ensureMic();
  const box = document.getElementById('latBox');
  if(!micReady){
    box.innerHTML = `<div class="banner">🎤 Mic not available — manual mode: say it out loud, then score yourself (no latency this way).</div>`;
    document.getElementById('toReveal').classList.remove('hidden');
    return;
  }
  document.getElementById('micBtn').classList.add('live');
  if(!s.selfStart){ await speak(s.opening, s.fast?1.35:1); }
  else { box.innerHTML = `<div class="hint center">Get ready… start the conversation 👇</div>`; await new Promise(r=>setTimeout(r,400)); }
  box.innerHTML = `<div class="hint center">Listening… speak the moment they finish.</div>`;
  listen(
    (lat)=>{ curLat=lat; showLatency(lat); },
    (timedOut)=>{
      document.getElementById('micBtn').classList.remove('live');
      if(timedOut && curLat===null){ box.innerHTML = `<div class="hint center">Didn't hear anything. Tap the mic to retry, or show the answer.</div>`; }
      document.getElementById('toReveal').classList.remove('hidden');
    }
  );
}
function showLatency(lat){

// 单元自身的延迟迷你曲线（oldest→newest）；颜色按最新一次的快慢
function sparkline(lats){
  const W=64, H=26, pad=3;
  if(!lats || lats.length===0) return `<svg width="${W}" height="${H}"></svg>`;
  const last=lats[lats.length-1];
  const col = last<1500?'var(--good)':last<3000?'var(--ok)':'var(--bad)';
  if(lats.length===1){ const cy=H/2; return `<svg width="${W}" height="${H}"><circle cx="${W-pad}" cy="${cy}" r="3" fill="${col}"/></svg>`; }
  const mn=Math.min(...lats), mx=Math.max(...lats), span=(mx-mn)||1;
  const pts=lats.map((v,i)=>{
    const x=pad+i*(W-2*pad)/(lats.length-1);
    const y=pad+(v-mn)/span*(H-2*pad);   // 值越小(越快)越靠上
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const [lx,ly]=pts[pts.length-1].split(',');
  return `<svg width="${W}" height="${H}" style="display:block"><polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="2.4" fill="${col}"/></svg>`;
}

// 首次使用引导（3 屏，只第一次弹；首页可重看）
const ONBOARD = [
  {ico:'💬', title:'Speak it, not just recognise it', body:'You understand English but freeze when you speak. This app makes you <b>say the line yourself</b> — until it comes out without thinking.'},
  {ico:'🎤', title:'Each scene, three steps', body:'① <b>Try it yourself first</b> — no peeking, force the words out<br>② <b>Shadow</b> the answer — speak along with the voice<br>③ <b>Beat the clock</b> — 5→3→2s, until it is automatic<br><br>The mic measures how fast you start speaking. Please <b>allow the mic and turn off silent mode</b>.'},
  {ico:'🔥', title:'Come back every day', body:'Lines you practise come back <b>right before you would forget them</b>.<br><br>Just ~10 min a day for a week and these scenes get much easier to say. <b>A little daily beats cramming.</b>'},
];
function renderOnboarding(i){
  const o=ONBOARD[i], last=i===ONBOARD.length-1;
  view().innerHTML = `
  <div class="card center" style="padding-top:30px">
    <div style="font-size:54px">${o.ico}</div>
    <div class="big" style="font-size:20px;margin:16px 0 12px">${o.title}</div>
    <div class="ctx" style="text-align:left;font-size:15px;line-height:1.75">${o.body}</div>
    <div class="drill-dots" style="margin:20px 0">${ONBOARD.map((_,k)=>`<span class="dot ${k===i?'on':''}"></span>`).join('')}</div>
    <button class="btn btn-primary" onclick="${last?'finishOnboarding()':`renderOnboarding(${i+1})`}">${last?'Start →':'Next →'}</button>
    ${last?'':`<button class="btn btn-ghost" style="margin-top:8px" onclick="finishOnboarding()">Skip</button>`}
  </div>`;
}
function finishOnboarding(){ localStorage.setItem(ONBOARD_KEY,'1'); renderHome(); }
function setTab(t){ document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.tab===t)); }
document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{
  stopListen(); speechSynthesis&&speechSynthesis.cancel();
  el.dataset.tab==='home'?renderHome():renderProgress();
});

//////////////////// boot ////////////////////
async function boot(){
  try{
    const r = await fetch('scenarios.json', {cache:'no-store'});
    SCENARIOS = await r.json();
  }catch(e){
    document.getElementById('view').innerHTML =
      `<div class="card">Failed to load scenarios.json — make sure it's in the same folder and opened over http (localhost), not via file://.</div>`;
    return;
  }
  document.getElementById('dateSub').textContent = fmtDate();
  document.getElementById('streak').textContent = `🔥 ${state.streak||0}`;
  if(!localStorage.getItem(ONBOARD_KEY)) renderOnboarding(0); else renderHome();
}
boot();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
